<button class="btn" data-p="add">${pi("plus",18,"#fff")}Tambah</button></div></div>${pnav("pm")}`}

P.addEventListener("click",e=>{const b=e.target.closest("[data-p]");if(!b)return;const d=b.dataset,a=d.p;

else if(a=="st"){const it=S.pmi[d.k][+d.i];it[1]=Math.max(0,it[1]+ +d.d);const t=pmiTot(),set=(id,v)=>{const el=$("#"+id);if(el)el.textContent=v};set("g"+d.k+d.i,it[1]+" g");set("k"+d.k+d.i,Math.round(it[1]*it[2])+" kkal");set("et",fm(t.k)+" kkal");set("pt",fm(t.p)+" g");set("lt",fm(t.l)+" g");set("ct",fm(t.c)+" g");set("ft",fm(t.f)+" g");set("ep",Math.round(t.k/6)+"%");set("pp",Math.round(t.p/.2)+"%");const eb=$("#eb"),pb=$("#pb");if(eb)eb.style.width=Math.min(100,t.k/6)+"%";if(pb)pb.style.width=Math.min(100,t.p/.2)+"%"}
else if(a=="pick"){S.pmt=S.pmt||{sel:0,g:50};S.pmt.sel=+d.i;render()}
else if(a=="pg2"){S.pmt=S.pmt||{sel:0,g:50};S.pmt.g=Math.max(25,Math.min(300,S.pmt.g+ +d.d));render()}

const DSG=[["belum","Belum dibagikan"],["dicatat","Sudah dibagikan"],["jalan","Evaluasi berjalan"],["siap","Siap kirim rekap"],["selesai","Evaluasi selesai"]];

const GRES=[[20,0,65,50,35],[25,0,60,45,30],[15,5,70,55,40],[20,0,65,40,35],[25,0,70,50,30],[20,0,60,50,40]];
function gset(k){S.sh=k=="belum"?0:1;S.done=k=="selesai"?1:0;S.res={};const p=present();
if(k=="jalan")p.slice(0,3).forEach(i=>S.res[i]=[...GRES[i]]);if(k=="siap"||k=="selesai"){p.forEach(i=>S.res[i]=[...GRES[i]]);}
if(k=="selesai"){S.rate=4;S.rs=["Rasa kurang cocok"];S.at="11.42"}if(k=="belum"||k=="dicatat"){S.rate=0;S.rs=[]}S.sheet=null;render()}

el.innerHTML=sw?`<b>DEMO STATE SISWA PJ</b>${DST.map(([k,l])=>`<button class="${S.sst==k?"on":""}" data-s="${k}">${l}</button>`).join("")}`:`<b>DEMO STATE GURU</b>${DSG.map(([k,l])=>`<button class="${gst()==k?"on":""}" data-g="${k}">${l}</button>`).join("")}`}
document.addEventListener("click",e=>{const b=e.target.closest("#demo button");if(!b)return;if(b.dataset.g){gset(b.dataset.g);return}const k=b.dataset.s;S.sst=k;S.hd=null;if(k=="terkirim"){if(!S.sr)S.sr=[20,0,65,50,35];if(!S.rate){S.rate=4;S.rs=["Rasa kurang cocok"]}}if(k=="pilih"){S.sr=null;S.rate=0;S.rs=[]}render()});

const DLG=[["list","Daftar responden"],["scan","Pindai ompreng"],["saved","Hasil tersimpan"],["manual","Isi manual"],["recap","Rekap sisa"],["rate","Rating & alasan"],["review","Cek & kirim"],["sent","Terima kasih"]];
function glay(k){const p=present();S.sh=1;S.done=0;S.sheet=null;S.dlg=0;S.sc="idle";
const full=()=>{S.res={};p.forEach(i=>S.res[i]=[...GRES[i]])};
if(k=="list"){S.res={};S.v="list"}
else if(k=="scan"){S.res={};S.i=0;S.v="scan"}
else if(k=="saved"){S.res={};S.res[p[0]]=[...GRES[p[0]]];S.i=0;S.sc="saved";S.v="scan"}
else if(k=="manual"){S.res={};S.i=0;S.man=[...GRES[p[0]]];S.v="manual"}
else if(k=="recap"){full();S.v="recap"}
else if(k=="rate"){full();S.rate=2;S.rs=[];S.tx="";S.v="rate"}
else if(k=="review"){full();S.rate=4;S.rs=["Rasa kurang cocok"];S.v="review"}
else if(k=="sent"){full();S.rate=4;S.rs=["Rasa kurang cocok"];S.done=1;S.at="11.42";S.v="sent"}
S.gl=k;render()}
function demoR(){let el=document.getElementById("demor");const GV=["home","ev","ak","prof","notif","list","scan","manual","recap","rate","review","perresp","persekat","sent"],show=S.rl=="g"&&GV.includes(S.v)&&innerWidth>=860;
if(!show){if(el)el.remove();return}

el.innerHTML=`<b>DEMO LAYAR GURU</b>${DLG.map(([k,l])=>`<button class="${cur==k?"on":""}" data-j="${k}">${l}</button>`).join("")}`}

[...c.children].forEach((x,j)=>x.classList.toggle("on",j==idx));clearTimeout(c._t);c._t=setTimeout(()=>{S.tm[c.dataset.k=="h"?0:1]=+c.children[idx].dataset.v},90)},true);
