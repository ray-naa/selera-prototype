menu:()=>{const m=MENU[S.md],dd=DAYS.find(x=>x[0]==S.md);return `<div class="scr">${sbar}${tbar("Detail Menu",(S.md=="Sel"?"Selasa, ":"")+dd[1],"home")}<div class="body"><div style="height:130px;border-radius:24px;background:var(--g100);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px">${I("image",30,"#5bc269")}<span style="font-weight:500;font-size:12px;color:var(--ter)">Foto menu</span></div>${m?`<div class="card" style="padding:6px 16px">${m.map((n,j)=>`<div class="rr"><span style="display:flex;align-items:center;gap:12px"><span class="code" style="border-radius:10px;width:36px;height:30px">${C[j][0]}</span><b style="font-size:15px;font-weight:500">${n}</b></span></div>`).join("")}</div>`:'<p class="cap" style="text-align:center;font-size:13px;padding:20px 0">Menu hari ini belum tersedia di prototipe ini.</p>'}<div style="display:flex;gap:8px">${DAYS.map(([d])=>`<button data-a="mday" data-x="${d}" style="flex:1;height:38px;border-radius:14px;font-size:13px;font-weight:${d==S.md?600:500};background:${d==S.md?"var(--brand)":"var(--sub)"};color:${d==S.md?"#fff":"var(--ter)"}">${d}</button>`).join("")}</div></div><div class="foot"><button class="btn" data-a="go" data-v="home">Kembali ke Beranda</button></div></div>`}
});
let TT;const toast=m=>{S.toast=m;render();clearTimeout(TT);TT=setTimeout(()=>{S.toast="";const t=$(".toast");if(t)t.remove()},2600)};
P.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const d=b.dataset,a=d.a;
if(a=="shared"){S.sh=1;toast("Tercatat: makanan dibagikan "+S.rt)}
else if(a=="resume"){const p=present();S.i=Math.max(0,p.findIndex(i=>!S.res[i]));S.sc="idle";S.v="scan";render()}
else if(a=="time"){S.tm=S.rt.split(".").map(Number);S.sheet="time";render()}
else if(a=="tstep"){const t=S.tm;if(d.k=="h")t[0]=(t[0]+ +d.d+24)%24;else t[1]=(t[1]+5*+d.d+60)%60;render();P.querySelectorAll(".sheet,.ov").forEach(x=>x.style.animation="none")}

else if(a=="sclose"){S.sheet=null;render()}
else if(a=="out"){S.sheet="out";render()}
else if(a=="logout"){S.sheet=null;S.f={};S.fe={};S.lg="";S.tries=0;S.v="a2";render()}
else if(a=="soon")toast("Halaman ini belum ada di prototipe");
else if(a=="aktab"){S.ak=d.x;render()}
else if(a=="evd"){S.evi=Math.max(0,+d.i);S.v="evd";render()}
else if(a=="tg"){const i=+d.i;S.ns[i]^=1;b.classList.toggle("on",!!S.ns[i])}
else if(a=="nf"){S.nf=d.x;render()}
else if(a=="nread"){S.nt[+d.i]=0;render()}
else if(a=="nall"){S.nt=S.nt.map(()=>0);render()}
else if(a=="rtype"){S.rtype=+d.i;render()}
else if(a=="rsend"){S.rep.unshift({t:RT[S.rtype],d:"Hari ini"});S.rtype=null;S.rtx="";S.v="lapordone";render()}
else if(a=="lihatlap"){S.ak="rep";S.v="ak";render()}
else if(a=="mday"){S.md=d.x;render()}});

function updList(){const n=present().length,low=n<3;$("#sb").classList.toggle("low",low);$("#nn").textContent=n+" / 6";$("#ca").classList.toggle("off",n!=6);S.att.forEach((a,i)=>{const r=$("#r"+i);r.classList.toggle("abs",!a);r.querySelector(".seg").dataset.on=a;r.querySelectorAll(".seg button").forEach((b,k)=>b.classList.toggle("on",(k==0)==!!a));r.querySelector(".cap").textContent=rid(i)+" · "+(a?"Absen "+ABS[i]:"tidak hadir")});const t=$("#nt");t.textContent=NT(low);t.classList.toggle("w",low);const g=$("#go");g.disabled=low;g.classList.toggle("dis",low);g.textContent=GO(n,low)}
let SPT;function render(){if(S.v=="a1"&&!SPT){SPT=setTimeout(()=>{SPT=0;if(S.v=="a1"){S.v="a2";render()}},2200)}if(S.v!==LV)S.toast="";PV=LV;const sw=(S.v=="perresp"||S.v=="persekat")&&(PV=="perresp"||PV=="persekat");P.className=S.v!==LV&&!sw?"nv":"";LV=S.v;P.innerHTML=V[S.v]()+(S.toast?`<div class="toast">${I("check",16,"#fff")}${S.toast}</div>`:"");const e=document.getElementById("cnt");if(e){const v=+e.dataset.v,t0=performance.now();const f=t=>{const k=Math.min(1,(t-t0)/1100),q=1-Math.pow(1-k,3);e.textContent=Math.round(v*q)+"%";if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}const si=P.querySelector(".segt i[data-to]");if(si)requestAnimationFrame(()=>requestAnimationFrame(()=>si.style.transform=`translateX(${si.dataset.to}%)`))}
function adv(){clearTimeout(T);clearInterval(CT);const j=nextIdx();S.sc="idle";if(j<0)S.v="recap";else{S.i=j;S.v="scan"}render()}
function shot(m){clearTimeout(T);clearInterval(CT);const cur=present()[S.i];
if(m){S.man=[...(S.res[cur]||[25,0,75,50,25])];S.sc="idle";S.v="manual";render();return}
const k=S.tr[cur]=(S.tr[cur]||0)+1,third=present().indexOf(cur)==2;
const gen=()=>{if(third&&k==1){S.sc="fail";render();return}S.res[cur]=C.map(()=>[0,0,10,20,35,50,65][Math.floor(Math.random()*7)]);if(third&&k==2){S.sc="chk";render();return}S.sc="saved";S.cd=2;render();CT=setInterval(()=>{S.cd=Math.max(0,S.cd-1);const e=document.getElementById("cd");if(e)e.textContent=S.cd},1000);T=setTimeout(adv,2000)};
S.sc="proc";render();T=setTimeout(gen,1500)}
P.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const d=b.dataset,a=d.a;
if(a=="go"){clearTimeout(T);clearInterval(CT);S.sc="idle";S.v=d.v;render()}
else if(a=="att"){S.att[+d.i]=+d.x;updList()}
else if(a=="all"){if(S.att.every(x=>x)){S.att=S.pv&&!S.pv.every(x=>x)?[...S.pv]:S.att.map(()=>0)}else{S.pv=[...S.att];S.att=S.att.map(()=>1)}updList()}
else if(a=="tab"){clearTimeout(T);clearInterval(CT);S.i=+d.i;S.sc="idle";S.v="scan";render()}
else if(a=="open"){const i=+d.i,was=S.open==i;S.open=was?null:i;P.querySelectorAll(".ro").forEach(r=>r.classList.toggle("open",!was&&+r.dataset.ro==i))}
else if(a=="mv"){const j=+d.j,x=+d.x;S.man[j]=x;const c=$("#m"+j);c.querySelectorAll(".opt button").forEach(b=>b.classList.toggle("on",+b.dataset.x==x));const h=c.querySelector(".chip");h.textContent=x+"%";h.classList.toggle("o",x>20)}
else if(a=="msave"){S.res[present()[S.i]]=[...S.man];adv()}
else if(a=="fix"){S.i=present().indexOf(+d.i);S.sc="idle";S.v="scan";render()}
else if(a=="start"){S.res={};S.tr={};S.tx="";S.i=0;S.sc="idle";S.rate=0;S.rs=[];S.open=null;S.v="scan";render()}
else if(a=="shot")shot(d.m);else if(a=="next")adv();
else if(a=="redo"){clearTimeout(T);clearInterval(CT);delete S.res[present()[S.i]];S.sc="idle";S.v="scan";render()}
else if(a=="flash"){S.flash^=1;render()}
else if(a=="rate"){const n=+d.n;S.fresh=S.rate==0||(n==5)!=(S.rate==5);if(S.fresh)S.rs=[];S.pop=n;S.rate=n;render()}
else if(a=="rs"){const x=d.x;S.rs=S.rs.includes(x)?S.rs.filter(y=>y!=x):[...S.rs,x];render()}
else if(a=="dlg"){S.dlg=1;render()}else if(a=="dlg0"){S.dlg=0;render()}
else if(a=="send"){S.dlg=0;S.done=1;S.at=new Date().toTimeString().slice(0,5).replace(":",".");S.v="sent";render()}});
P.addEventListener("input",e=>{if(e.target.classList.contains("ta"))S.tx=e.target.value});
P.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const d=b.dataset,a=d.a;
if(a=="role"){S.f={};S.fe={};S.lg="";S.tries=0;S.eye=0;S.tc=0;S.v=d.v;render()}
else if(a=="eye"){S.eye^=1;render()}
else if(a=="rem"){S.rem^=1;render()}
else if(a=="tc"){S.tc^=1;if(S.fe&&"tc" in S.fe)delete S.fe.tc;render()}
else if(a=="lgin"){const r=d.r,f=S.f,m={};
if(r=="guru"||r=="sppg"){if(!f.e)m.e=r=="guru"?"Email wajib diisi.":"Email atau kode SPPG wajib diisi.";if(!f.p)m.p="Password wajib diisi."}
else if(r=="siswa"){if(!f.id)m.id="ID Siswa wajib diisi.";if((f.pin||"").length<6)m.pin="PIN harus 6 angka."}
else{if(!f.kode)m.kode="Kode SPPG wajib diisi.";if(!f.mail)m.mail="Email kerja wajib diisi.";else if(!/^\S+@\S+\.\S+$/.test(f.mail))m.mail="Format email belum benar.";if((f.p||"").length<8)m.p="Password minimal 8 karakter.";if(!S.tc)m.tc="Setujui syarat dan ketentuan untuk lanjut."}
S.fe=m;if(Object.keys(m).length){render();return}
S.lg="busy";render();
setTimeout(()=>{if(S.lg!="busy")return;S.lg="";
if(r=="guru"){if(!S.tries){S.tries=1;S.fe={e:"",p:"Email atau password salah. Coba lagi."};render()}else{S.v="home";render()}}
else if(r=="daftar"){S.f={};S.v="a5";render();toast("Pendaftaran terkirim. Silakan masuk.")}
else{render();toast(r=="siswa"?"Beranda Siswa belum ada di prototipe ini":"Beranda Pengelola belum ada di prototipe ini")}},1200)}});
